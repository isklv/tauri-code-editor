[package]
name = "geko"
version = "0.1.0"
edition = "2021"

[lib]
name = "tauri_code_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "8"
ureq = "3.4.2"
flate2 = "1.1.10"
tar = "0.4.46"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Smaller binaries matter on Android, where the native library ships inside the APK.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
